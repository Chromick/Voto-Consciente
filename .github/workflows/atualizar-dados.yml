name: Atualizar dados e publicar site

# Roda de graca no plano gratuito do GitHub:
#  - Actions: 2.000 minutos/mes em repositorio publico (aqui gasta ~10 min/semana)
#  - Pages: hospedagem estatica gratuita
on:
  schedule:
    - cron: "0 7 * * 1"        # toda segunda, 04h no horario de Brasilia
  workflow_dispatch:            # e no botao "Run workflow"
  push:
    branches: [main]
    paths: ["web/**", "etl/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  coletar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # O TSE bloqueia qualquer cliente que nao seja navegador de verdade (403
      # por impressao digital de TLS - nem curl com todos os cabecalhos passa),
      # entao as candidaturas de 2026 sao coletadas com um Chromium headless.
      # E a UNICA etapa que precisa de dependencia externa; se falhar, o site
      # publica a cedula ja versionada em dados/cedula.
      - name: Instalar navegador para a coleta do TSE
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Coletar candidaturas de 2026 (TSE)
        continue-on-error: true
        timeout-minutes: 45
        run: python tools/coletar_tse.py

      # O resto do ETL nao tem dependencia externa: e stdlib puro.
      # Se as APIs do governo estiverem fora do ar, a coleta falha mas o site
      # continua publicando os dados ja versionados em dados/ - melhor um site
      # com dado da semana passada do que site fora do ar. A etapa seguinte
      # garante que o dado publicado e valido de qualquer forma.
      - name: Coletar dados publicos
        continue-on-error: true
        env:
          # opcional: cadastre a chave gratuita e guarde em Settings > Secrets
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
        run: |
          ANO=$(date +%Y)
          python -m etl.build --anos $((ANO-1)) $ANO

      - name: Conferir se gerou dado valido
        run: |
          python - <<'PY'
          import json, pathlib, sys
          d = json.load(open("dados/ranking.json", encoding="utf-8"))
          n = len(d["parlamentares"])
          print("parlamentares:", n)
          if n < 400:
              sys.exit(f"coleta suspeita: apenas {n} parlamentares")
          idx = pathlib.Path("dados/cedula/indice.json")
          if idx.exists():
              c = json.loads(idx.read_text(encoding="utf-8"))
              print("candidaturas 2026:", c["total"])
              if c["total"] < 15000:
                  sys.exit(f"cedula suspeita: apenas {c['total']} candidaturas")
          PY

      # Guardar no repositorio e conveniencia (historico dos dados), nao
      # requisito: o site e publicado a partir do diretorio de trabalho. Se
      # outro run tiver empurrado dados nesse meio tempo, rebase e tenta de
      # novo; se ainda assim falhar, seguimos para a publicacao.
      - name: Guardar os dados no repositorio
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados
          git diff --staged --quiet && exit 0
          git commit -m "dados: atualizacao automatica"
          git push || (git pull --rebase --autostash origin main && git push)

      - name: Montar o site (web/ + dados/)
        run: |
          mkdir -p site
          cp -r web/* site/
          cp -r dados site/dados

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
